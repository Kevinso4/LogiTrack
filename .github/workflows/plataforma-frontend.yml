# El despliegue del frontend lo hace la integración nativa de Vercel; aquí solo se valida el build.
name: plataforma-frontend

on:
  push:
    branches: [main, develop]
    paths: ["plataforma/frontend/**", ".github/workflows/plataforma-frontend.yml"]
  pull_request:
    paths: ["plataforma/frontend/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plataforma/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
