# Pipeline por servicio afectado (dorny/paths-filter): solo se testea lo que
# cambió, y el commit inicial valida los cuatro a la vez (filtros sin bases).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [fleet-service, tracking-service, routing-service, shipment-service]
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            fleet-service:
              - 'fleet-service/**'
            tracking-service:
              - 'tracking-service/**'
            routing-service:
              - 'routing-service/**'
            shipment-service:
              - 'shipment-service/**'
          base: main

      - uses: actions/setup-python@v5
        if: steps.filtro.outputs[matrix.servicio] == 'true' || github.ref == 'refs/heads/main'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.servicio }}/requirements-dev.txt

      - name: Instalar dependencias
        if: steps.filtro.outputs[matrix.servicio] == 'true' || github.ref == 'refs/heads/main'
        working-directory: ${{ matrix.servicio }}
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Formato (black)
        if: steps.filtro.outputs[matrix.servicio] == 'true' || github.ref == 'refs/heads/main'
        working-directory: ${{ matrix.servicio }}
        run: black --check --line-length 100 .

      - name: Estilo (flake8)
        if: steps.filtro.outputs[matrix.servicio] == 'true' || github.ref == 'refs/heads/main'
        working-directory: ${{ matrix.servicio }}
        run: flake8 .

      - name: Tests
        if: steps.filtro.outputs[matrix.servicio] == 'true' || github.ref == 'refs/heads/main'
        working-directory: ${{ matrix.servicio }}
        run: pytest -q

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de los cuatro servicios
        run: |
          for servicio in fleet-service tracking-service routing-service shipment-service; do
            imagen="ghcr.io/${{ github.repository_owner }}/logitrack-${servicio%%-*}:${{ github.sha }}"
            docker build -t "$imagen" "./$servicio"
            docker push "$imagen"
          done